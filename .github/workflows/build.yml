name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        # arm64-only: ffmpeg_kit_flutter_new_audio bundles native libraries
        # for every ABI, which balloons a universal build to 200MB+.
        # arm64-v8a covers every real Android phone from the last ~8 years.
        run: flutter build apk --debug --target-platform android-arm64 --split-per-abi

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: mp3splitter-debug-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          retention-days: 14
